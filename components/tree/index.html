<div
        class="mob-tree"
        ng-class="{
        'is_disabled':$ctrl.ngDisabled,
    }"
        refs="$ctrl.ngRef">
    <mob-tree-node ng-repeat="node in $ctrl.nodeList track by $index"
                   ng-if="node._filterVisible !== false"
                   data="node"
                   node-key="$ctrl.nodeKey"
                   expand-on-click-node="$ctrl.expandOnClickNode"
                   check-on-click-node="$ctrl.checkOnClickNode"
                   show-checkbox="node.showCheckbox"
                   allow-check="node.allowCheck"
                   props="$ctrl.props"
    >
</div>
